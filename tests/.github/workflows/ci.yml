# ═══════════════════════════════════════════════════════════════════════
# CI Pipeline — GoodOfTheOrder
#
# Runs on every push and PR to main. Ensures:
# 1. Clean npm install works (no bundled node_modules)
# 2. Build succeeds (catches import errors, syntax issues)
# 3. Lint passes
# 4. E2E tests pass (if test credentials configured)
# ═══════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Clean install (catches missing deps, bad lockfile) ──
      - name: Install dependencies
        run: npm ci

      # ── Verify no secrets or junk files shipped ──
      - name: Check repo hygiene
        run: |
          echo "Checking for accidentally committed files..."
          FAIL=0
          if [ -f ".env.local" ]; then echo "❌ .env.local found in repo!"; FAIL=1; fi
          if [ -d "node_modules" ] && git ls-files --error-unmatch node_modules/ 2>/dev/null; then echo "❌ node_modules tracked in git!"; FAIL=1; fi
          if [ -f "desktop.ini" ]; then echo "❌ desktop.ini found in repo!"; FAIL=1; fi
          if [ $FAIL -ne 0 ]; then exit 1; fi
          echo "✅ Repo hygiene check passed"

      # ── Lint ──
      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true  # Don't block on lint warnings initially

      # ── Build (catches all import/syntax errors) ──
      - name: Build
        env:
          # Dummy values — build only checks syntax/imports, doesn't connect
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key-for-build-only
        run: npm run build

      # ── Verify build output exists ──
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then echo "❌ No dist/ directory after build"; exit 1; fi
          if [ ! -f "dist/index.html" ]; then echo "❌ No index.html in dist/"; exit 1; fi
          echo "✅ Build output verified"
          echo "Build size: $(du -sh dist/ | cut -f1)"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build  # Only run E2E if build passes
    # Only run if test credentials are configured
    if: ${{ vars.RUN_E2E_TESTS == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
